<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1319" />
    <title>Setflow</title>
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      :root {
        --canvas: #0e1319;
        --accent: #6ba8e5;
        --accent-bg: #17334d;
        --accent-border: #24496b;
        --text-primary: #eaeef3;
        --text-secondary: #a3aebc;
        --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
        --font-ui: Outfit, Inter, -apple-system, system-ui, sans-serif;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: var(--canvas);
        color: var(--text-primary);
      }
      .boot-splash {
        display: flex;
        height: 100%;
        width: 100%;
        align-items: center;
        justify-content: center;
        background: var(--canvas);
      }
      .boot-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .boot-splash-mark {
        display: flex;
        height: 56px;
        width: 56px;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: var(--accent-bg);
        color: var(--accent);
        border: 1px solid var(--accent-border);
        animation: boot-mark 1.6s ease-in-out infinite;
      }
      .boot-splash-name {
        margin-top: 18px;
        color: var(--accent);
        font-family: var(--font-display);
        font-size: 32px;
        line-height: 1.2;
      }
      .boot-splash-tag {
        margin-top: 6px;
        color: var(--text-secondary);
        font-family: var(--font-ui);
        font-size: 13px;
        line-height: 1.4;
      }
      .boot-splash-eq {
        display: flex;
        height: 18px;
        align-items: flex-end;
        gap: 4px;
        margin-top: 22px;
      }
      .boot-splash-eq span {
        width: 4px;
        height: 10px;
        border-radius: 2px;
        background: var(--accent);
        transform-origin: bottom;
        animation: boot-eq 0.9s ease-in-out infinite;
      }
      .boot-splash-eq span:nth-child(1) { height: 12px; }
      .boot-splash-eq span:nth-child(2) { height: 18px; animation-delay: 0.16s; }
      .boot-splash-eq span:nth-child(3) { height: 11px; animation-delay: 0.3s; }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @keyframes boot-mark {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.96); opacity: 0.82; }
      }
      @keyframes boot-eq {
        0%, 100% { transform: scaleY(0.35); }
        50% { transform: scaleY(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-mark,
        .boot-splash-eq span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-live="polite" aria-busy="true">
        <div class="boot-splash-inner">
          <div class="boot-splash-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="28" height="28">
              <path fill="currentColor" d="M15 6h2v8h8v2h-8v10h-2V16H7v-2h8z" />
            </svg>
          </div>
          <div class="boot-splash-name">Setflow</div>
          <div class="boot-splash-tag">Worship setlist builder</div>
          <div class="boot-splash-eq" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <span class="sr-only">Loading Setflow</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
